<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1f2937">Proposed Features vs. Each Challenge — Full Breakdown (n = 22 per column)</text>

  <line x1="40" y1="230" x2="450" y2="230" stroke="#9ca3af" stroke-width="1"/>

  <!-- D1 column: Yes 2, Partial 2, No 18 (total 22) -->
  <rect x="60" y="76" width="90" height="126" fill="#E0E7FF" stroke="#374151" stroke-width="1.5"/>
  <rect x="60" y="202" width="90" height="14" fill="#A5B4FC" stroke="#374151" stroke-width="1.5"/>
  <rect x="60" y="216" width="90" height="14" fill="#4F46E5" stroke="#374151" stroke-width="1.5"/>
  <text x="105" y="66" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">22</text>
  <text x="105" y="246" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">D1</text>
  <text x="105" y="262" font-size="11" fill="#4b5563" text-anchor="middle">Yes 2 · Partial 2 · No 18</text>

  <!-- D2 column: Yes 4, Partial 1, No 17 (total 22) -->
  <rect x="190" y="76" width="90" height="119" fill="#F3E8FF" stroke="#374151" stroke-width="1.5"/>
  <rect x="190" y="195" width="90" height="7" fill="#D8B4FE" stroke="#374151" stroke-width="1.5"/>
  <rect x="190" y="202" width="90" height="28" fill="#9333EA" stroke="#374151" stroke-width="1.5"/>
  <text x="235" y="66" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">22</text>
  <text x="235" y="246" font-size="14" font-weight="bold" fill="#9333EA" text-anchor="middle">D2</text>
  <text x="235" y="262" font-size="11" fill="#4b5563" text-anchor="middle">Yes 4 · Partial 1 · No 17</text>

  <!-- D3 column: Yes 4, Partial 4, No 14 (total 22) -->
  <rect x="320" y="76" width="90" height="98" fill="#FFEDD5" stroke="#374151" stroke-width="1.5"/>
  <rect x="320" y="174" width="90" height="28" fill="#FDBA74" stroke="#374151" stroke-width="1.5"/>
  <rect x="320" y="202" width="90" height="28" fill="#EA580C" stroke="#374151" stroke-width="1.5"/>
  <text x="365" y="66" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">22</text>
  <text x="365" y="246" font-size="14" font-weight="bold" fill="#EA580C" text-anchor="middle">D3</text>
  <text x="365" y="262" font-size="11" fill="#4b5563" text-anchor="middle">Yes 4 · Partial 4 · No 14</text>

  <text x="20" y="286" font-size="11" fill="#4b5563">Solid = Yes · mid tint = Partial · light tint = No, each column classified against that single challenge only.</text>
  <text x="20" y="298" font-size="11" fill="#4b5563">Each column totals 22; a feature can score Yes/Partial in more than one column at once.</text>
</svg>
