<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>

  <text x="170" y="20" font-size="13" fill="#8a8d99">Khởi động</text>
  <line x1="170" y1="28" x2="170" y2="330" stroke="#e3e6ef" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- UI -->
  <text x="150" y="46" font-size="18" font-weight="700" fill="#F37021" text-anchor="end">Giao diện</text>
  <rect x="170" y="26" width="590" height="28" rx="6" fill="#F37021"/>

  <!-- Infrastructure -->
  <text x="150" y="111" font-size="18" font-weight="700" fill="#50B848" text-anchor="end">Hạ tầng</text>
  <rect x="170" y="91" width="590" height="28" rx="6" fill="#50B848"/>

  <!-- Business Logic -->
  <text x="150" y="176" font-size="18" font-weight="700" fill="#034EA2" text-anchor="end">Nghiệp vụ</text>
  <rect x="170" y="156" width="590" height="28" rx="6" fill="#034EA2"/>

  <!-- Security -->
  <text x="150" y="241" font-size="18" font-weight="700" fill="#33B2C1" text-anchor="end">Bảo mật</text>
  <rect x="170" y="221" width="590" height="28" rx="6" fill="#33B2C1"/>

  <!-- AI -->
  <text x="150" y="306" font-size="18" font-weight="700" fill="#19226D" text-anchor="end">AI</text>
  <rect x="170" y="286" width="590" height="28" rx="6" fill="#19226D"/>

  <!-- convergence lines from each lane into the delivery node -->
  <g stroke="#9ca3af" stroke-width="2" fill="none">
    <path d="M760,40 C 840,40 860,170 905,170"/>
    <path d="M760,105 C 840,105 870,170 905,170"/>
    <path d="M760,170 L 905,170"/>
    <path d="M760,235 C 840,235 870,170 905,170"/>
    <path d="M760,300 C 840,300 860,170 905,170"/>
  </g>

  <circle cx="935" cy="170" r="30" fill="#19226D"/>
  <path d="M923,170 L933,180 L950,160" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="935" y="225" font-size="16" font-weight="700" fill="#19226D" text-anchor="middle">Bàn giao</text>

  <text x="465" y="365" font-size="13" fill="#8a8d99" text-anchor="middle">Năm nhóm tính năng phát triển song song, hội tụ để tích hợp và trình diễn</text>
</svg>
