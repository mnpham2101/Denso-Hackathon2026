<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1100" height="260" fill="#ffffff"/>

  <!-- Card 1: UI (orange) -->
  <g>
    <rect x="20" y="25" width="180" height="210" rx="16" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="23" y="28" width="174" height="8" rx="4" fill="#F37021"/>
    <g transform="translate(110,103) scale(1.6)" stroke="#F37021" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-28" y="-24" width="56" height="44" rx="6"/>
      <line x1="-28" y1="-10" x2="28" y2="-10"/>
      <circle cx="-20" cy="-17" r="2.2" fill="#F37021" stroke="none"/>
      <circle cx="-12" cy="-17" r="2.2" fill="#F37021" stroke="none"/>
      <circle cx="-4" cy="-17" r="2.2" fill="#F37021" stroke="none"/>
      <path d="M6 4 L22 16 L16 17 L20 26 L15 28 L11 19 L6 24 Z" fill="#F37021" stroke="none"/>
    </g>
    <text x="110" y="213" font-size="19" font-weight="700" fill="#19226D" text-anchor="middle">UI</text>
  </g>

  <!-- Card 2: Infrastructure (blue — matches "Cloud & On-Premises" on the Feature Deployment page) -->
  <g>
    <rect x="235" y="25" width="180" height="210" rx="16" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="238" y="28" width="174" height="8" rx="4" fill="#034EA2"/>
    <g transform="translate(325,103) scale(1.6)" stroke="#034EA2" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-26" y="-24" width="52" height="14" rx="3"/>
      <rect x="-26" y="-6" width="52" height="14" rx="3"/>
      <rect x="-26" y="12" width="52" height="14" rx="3"/>
      <circle cx="-18" cy="-17" r="2.4" fill="#034EA2" stroke="none"/>
      <circle cx="-18" cy="1" r="2.4" fill="#034EA2" stroke="none"/>
      <circle cx="-18" cy="19" r="2.4" fill="#034EA2" stroke="none"/>
    </g>
    <text x="325" y="213" font-size="19" font-weight="700" fill="#034EA2" text-anchor="middle">Infrastructure</text>
  </g>

  <!-- Card 3: Business Logic (teal — matches "Business Logic" on the Feature Deployment page) -->
  <g>
    <rect x="450" y="25" width="180" height="210" rx="16" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="453" y="28" width="174" height="8" rx="4" fill="#33B2C1"/>
    <g transform="translate(540,103) scale(1.6)" stroke="#33B2C1" fill="none" stroke-width="4" stroke-linecap="round">
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="5"/>
      <line x1="0" y1="-24" x2="0" y2="-16"/>
      <line x1="0" y1="16" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-16" y2="0"/>
      <line x1="16" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-17" x2="-11.3" y2="-11.3"/>
      <line x1="11.3" y1="11.3" x2="17" y2="17"/>
      <line x1="-17" y1="17" x2="-11.3" y2="11.3"/>
      <line x1="11.3" y1="-11.3" x2="17" y2="-17"/>
    </g>
    <text x="540" y="213" font-size="19" font-weight="700" fill="#33B2C1" text-anchor="middle">Business Logic</text>
  </g>

  <!-- Card 4: Security (navy — matches the Gateway box's own security badge on the Feature Deployment page) -->
  <g>
    <rect x="665" y="25" width="180" height="210" rx="16" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="668" y="28" width="174" height="8" rx="4" fill="#19226D"/>
    <g transform="translate(755,103) scale(1.6)" stroke="#19226D" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-26 L22,-16 L22,4 C22,20 10,28 0,32 C-10,28 -22,20 -22,4 L-22,-16 Z"/>
      <path d="M-10,2 L-2,10 L14,-8"/>
    </g>
    <text x="755" y="213" font-size="19" font-weight="700" fill="#19226D" text-anchor="middle">Security</text>
  </g>

  <!-- Card 5: AI (green — matches "AI Processing" on the Feature Deployment page) -->
  <g>
    <rect x="880" y="25" width="180" height="210" rx="16" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="883" y="28" width="174" height="8" rx="4" fill="#50B848"/>
    <g transform="translate(970,103) scale(1.6)" stroke="#50B848" fill="none" stroke-width="3" stroke-linecap="round">
      <rect x="-20" y="-20" width="40" height="40" rx="6" stroke-width="4"/>
      <line x1="-28" y1="-12" x2="-20" y2="-12"/>
      <line x1="-28" y1="0" x2="-20" y2="0"/>
      <line x1="-28" y1="12" x2="-20" y2="12"/>
      <line x1="28" y1="-12" x2="20" y2="-12"/>
      <line x1="28" y1="0" x2="20" y2="0"/>
      <line x1="28" y1="12" x2="20" y2="12"/>
      <line x1="-12" y1="-28" x2="-12" y2="-20"/>
      <line x1="12" y1="-28" x2="12" y2="-20"/>
      <line x1="-12" y1="28" x2="-12" y2="20"/>
      <line x1="12" y1="28" x2="12" y2="20"/>
      <circle cx="-7" cy="-6" r="3" fill="#50B848" stroke="none"/>
      <circle cx="7" cy="-2" r="3" fill="#50B848" stroke="none"/>
      <circle cx="-3" cy="8" r="3" fill="#50B848" stroke="none"/>
      <line x1="-7" y1="-6" x2="7" y2="-2" stroke-width="2"/>
      <line x1="7" y1="-2" x2="-3" y2="8" stroke-width="2"/>
      <line x1="-3" y1="8" x2="-7" y2="-6" stroke-width="2"/>
    </g>
    <text x="970" y="213" font-size="19" font-weight="700" fill="#50B848" text-anchor="middle">AI</text>
  </g>
</svg>
