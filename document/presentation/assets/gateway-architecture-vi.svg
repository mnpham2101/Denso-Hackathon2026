<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <!-- ================= connecting lines (drawn first, under everything) ================= -->
  <g fill="none" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round">
    <!-- left (navy) — floor machinery connectivity -->
    <path d="M230,190 C 350,190 380,380 500,380" stroke="#19226D"/>
    <path d="M230,380 L500,380" stroke="#19226D"/>
    <path d="M230,570 C 350,570 380,380 500,380" stroke="#19226D"/>
    <!-- right — dashboard (orange), business logic (teal), AI (green), cloud/on-prem (blue) -->
    <path d="M700,380 C 820,380 850,140 970,140" stroke="#F37021"/>
    <path d="M700,380 C 800,380 850,300 970,300" stroke="#33B2C1"/>
    <path d="M700,380 C 800,380 850,460 970,460" stroke="#50B848"/>
    <path d="M700,380 C 820,380 850,620 970,620" stroke="#034EA2"/>
  </g>
  <g fill="#9aa3c9">
    <circle cx="500" cy="380" r="4"/>
    <circle cx="700" cy="380" r="4"/>
  </g>

  <!-- ================= center: Gateway device ================= -->
  <line x1="600" y1="271" x2="600" y2="320" stroke="#19226D" stroke-width="2.5" stroke-dasharray="2 6"/>
  <rect x="530" y="225" width="140" height="46" rx="10" fill="#ffffff" stroke="#19226D" stroke-width="1.5"/>
  <text x="600" y="253" font-size="15" font-weight="700" fill="#19226D" text-anchor="middle">Xử Lý Biên</text>

  <rect x="500" y="320" width="200" height="120" rx="16" fill="#19226D"/>
  <g stroke="#4a56b8" stroke-width="2" opacity="0.7">
    <line x1="524" y1="412" x2="676" y2="412"/>
    <line x1="524" y1="420" x2="676" y2="420"/>
    <line x1="524" y1="428" x2="676" y2="428"/>
  </g>
  <text x="600" y="375" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">GATEWAY</text>
  <text x="600" y="396" font-size="13" fill="#c7cdf0" text-anchor="middle">Trung Tâm Dữ Liệu</text>

  <!-- security badge -->
  <circle cx="700" cy="320" r="22" fill="#ffffff" stroke="#19226D" stroke-width="2.5"/>
  <g transform="translate(700,320) scale(0.5)" stroke="#19226D" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-26 L22,-16 L22,4 C22,20 10,28 0,32 C-10,28 -22,20 -22,4 L-22,-16 Z"/>
    <path d="M-10,2 L-2,10 L14,-8"/>
  </g>

  <!-- ================= left cards: floor machinery connectivity (navy) ================= -->
  <!-- L1: Production Line -->
  <g>
    <rect x="40" y="120" width="190" height="140" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="43" y="123" width="184" height="7" rx="3.5" fill="#19226D"/>
    <g transform="translate(135,180)" stroke="#19226D" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-40" y="8" width="80" height="16" rx="8"/>
      <circle cx="-26" cy="16" r="3.5" fill="#19226D" stroke="none"/>
      <circle cx="0" cy="16" r="3.5" fill="#19226D" stroke="none"/>
      <circle cx="26" cy="16" r="3.5" fill="#19226D" stroke="none"/>
      <rect x="-24" y="-8" width="14" height="14" rx="2"/>
      <rect x="4" y="-8" width="14" height="14" rx="2"/>
      <path d="M-34,-34 L-6,-34 L-6,-10"/>
      <path d="M-12,-16 L-2,-10 L-12,-4" fill="#19226D"/>
    </g>
    <text x="135" y="242" font-size="17" font-weight="700" fill="#19226D" text-anchor="middle">Dây Chuyền</text>
  </g>

  <!-- L2: Machine Sensors -->
  <g>
    <rect x="40" y="310" width="190" height="140" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="43" y="313" width="184" height="7" rx="3.5" fill="#19226D"/>
    <g transform="translate(135,370)" stroke="#19226D" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-16" y="-4" width="32" height="32" rx="5"/>
      <circle cx="0" cy="-16" r="3" fill="#19226D" stroke="none"/>
      <path d="M-13,-21 A19,19 0 0,1 13,-21"/>
      <path d="M-6,-24 A9,9 0 0,1 6,-24"/>
    </g>
    <text x="135" y="432" font-size="17" font-weight="700" fill="#19226D" text-anchor="middle">Cảm Biến</text>
  </g>

  <!-- L3: Worker Check-In (timecard + card reader) -->
  <g>
    <rect x="40" y="500" width="190" height="140" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="43" y="503" width="184" height="7" rx="3.5" fill="#19226D"/>
    <g transform="translate(135,560)">
      <g stroke="#19226D" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-34" width="34" height="54" rx="6"/>
        <rect x="0" y="-24" width="18" height="4" rx="2" fill="#19226D" stroke="none"/>
        <circle cx="17" cy="-14" r="2.5" fill="#19226D" stroke="none"/>
      </g>
      <g transform="rotate(-14) translate(-40,-6)">
        <rect x="-16" y="-11" width="32" height="22" rx="3" fill="#ffffff" stroke="#19226D" stroke-width="3"/>
        <circle cx="-8" cy="-3" r="3" fill="none" stroke="#19226D" stroke-width="2"/>
        <line x1="0" y1="-5" x2="10" y2="-5" stroke="#19226D" stroke-width="2"/>
        <line x1="0" y1="1" x2="8" y2="1" stroke="#19226D" stroke-width="2"/>
        <rect x="-16" y="6" width="32" height="4" fill="#19226D"/>
      </g>
    </g>
    <text x="135" y="622" font-size="17" font-weight="700" fill="#19226D" text-anchor="middle">Chấm Công</text>
  </g>

  <!-- ================= right cards ================= -->
  <!-- R1: Dashboard & Reports (orange) -->
  <g>
    <rect x="970" y="80" width="190" height="120" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="973" y="83" width="184" height="7" rx="3.5" fill="#F37021"/>
    <g transform="translate(1065,128) scale(0.85)" stroke="#F37021" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-35" y="-30" width="70" height="48" rx="5"/>
      <line x1="0" y1="18" x2="0" y2="27"/>
      <line x1="-13" y1="27" x2="13" y2="27"/>
      <rect x="-24" y="-4" width="9" height="16" fill="#F37021" stroke="none"/>
      <rect x="-9" y="-10" width="9" height="22" fill="#F37021" stroke="none"/>
      <rect x="6" y="-16" width="9" height="28" fill="#F37021" stroke="none"/>
      <path d="M-26,-16 L-11,-20 L4,-24 L20,-26" stroke-width="2.5"/>
    </g>
    <text x="1065" y="182" font-size="17" font-weight="700" fill="#F37021" text-anchor="middle">Bảng Điều Khiển</text>
  </g>

  <!-- R2: Business Logic (teal) -->
  <g>
    <rect x="970" y="240" width="190" height="120" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="973" y="243" width="184" height="7" rx="3.5" fill="#33B2C1"/>
    <g transform="translate(1065,288)" stroke="#33B2C1" fill="none" stroke-width="3.5" stroke-linecap="round">
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="5"/>
      <line x1="0" y1="-24" x2="0" y2="-16"/>
      <line x1="0" y1="16" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-16" y2="0"/>
      <line x1="16" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-17" x2="-11.3" y2="-11.3"/>
      <line x1="11.3" y1="11.3" x2="17" y2="17"/>
      <line x1="-17" y1="17" x2="-11.3" y2="11.3"/>
      <line x1="11.3" y1="-11.3" x2="17" y2="-17"/>
    </g>
    <text x="1065" y="342" font-size="17" font-weight="700" fill="#33B2C1" text-anchor="middle">Nghiệp Vụ</text>
  </g>

  <!-- R3: AI Processing (green) -->
  <g>
    <rect x="970" y="400" width="190" height="120" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="973" y="403" width="184" height="7" rx="3.5" fill="#50B848"/>
    <g transform="translate(1065,448) scale(0.85)" stroke="#50B848" fill="none" stroke-width="3" stroke-linecap="round">
      <rect x="-20" y="-20" width="40" height="40" rx="6" stroke-width="4"/>
      <line x1="-28" y1="-12" x2="-20" y2="-12"/>
      <line x1="-28" y1="0" x2="-20" y2="0"/>
      <line x1="-28" y1="12" x2="-20" y2="12"/>
      <line x1="28" y1="-12" x2="20" y2="-12"/>
      <line x1="28" y1="0" x2="20" y2="0"/>
      <line x1="28" y1="12" x2="20" y2="12"/>
      <line x1="-12" y1="-28" x2="-12" y2="-20"/>
      <line x1="12" y1="-28" x2="12" y2="-20"/>
      <line x1="-12" y1="28" x2="-12" y2="20"/>
      <line x1="12" y1="28" x2="12" y2="20"/>
      <circle cx="-7" cy="-6" r="3" fill="#50B848" stroke="none"/>
      <circle cx="7" cy="-2" r="3" fill="#50B848" stroke="none"/>
      <circle cx="-3" cy="8" r="3" fill="#50B848" stroke="none"/>
      <line x1="-7" y1="-6" x2="7" y2="-2" stroke-width="2"/>
      <line x1="7" y1="-2" x2="-3" y2="8" stroke-width="2"/>
      <line x1="-3" y1="8" x2="-7" y2="-6" stroke-width="2"/>
    </g>
    <text x="1065" y="502" font-size="17" font-weight="700" fill="#50B848" text-anchor="middle">Xử Lý AI</text>
  </g>

  <!-- R4: Cloud & On-Premises (blue) -->
  <g>
    <rect x="970" y="560" width="190" height="120" rx="14" fill="#ffffff" stroke="#e3e6ef" stroke-width="2"/>
    <rect x="973" y="563" width="184" height="7" rx="3.5" fill="#034EA2"/>
    <g transform="translate(1065,608)">
      <path d="M-28,4 C-36,4 -36,-11 -27,-12 C-26,-23 -12,-25 -5,-18 C3,-27 19,-22 18,-11 C27,-11 27,4 18,4 Z" fill="#034EA2"/>
      <g stroke="#034EA2" fill="none" stroke-width="3" stroke-linecap="round">
        <rect x="-22" y="18" width="44" height="12" rx="2.5"/>
        <rect x="-22" y="33" width="44" height="12" rx="2.5"/>
        <circle cx="-14" cy="24" r="1.8" fill="#034EA2" stroke="none"/>
        <circle cx="-14" cy="39" r="1.8" fill="#034EA2" stroke="none"/>
      </g>
      <path d="M0,7 L0,17 M-4,13 L0,17 L4,13" stroke="#034EA2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1065" y="662" font-size="17" font-weight="700" fill="#034EA2" text-anchor="middle">Đám Mây &amp; Tại Chỗ</text>
  </g>

  <text x="600" y="740" font-size="14" fill="#8a8d99" text-anchor="middle">Gateway được bảo mật tổng hợp dữ liệu sàn nhà máy và phân phối đến báo cáo, nghiệp vụ, AI, và đám mây/tại chỗ</text>
</svg>
